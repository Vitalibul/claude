<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290"><text x="10" y="24" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" text-anchor="start" fill="#1F5C45" font-weight="bold">Straturile unei tencuieli interioare / The layers of an interior plaster</text><rect x="40" y="40" width="110" height="220" fill="#EEEEEE" stroke="#2B3A33" stroke-width="1.5"/><circle cx="95" cy="62" r="4" fill="#2B3A33"/><line x1="95" y1="62" x2="420" y2="62" stroke="#2B3A33" stroke-width="1" stroke-dasharray="3,3"/><text x="430" y="60" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="start" fill="#2B3A33" font-weight="bold">1. zidăria</text><text x="430" y="77" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" text-anchor="start" fill="#555" font-style="italic">the wall (bricks, BCA)</text><rect x="150" y="40" width="10" height="220" fill="#C5E1A5" stroke="#2B3A33" stroke-width="1.5"/><circle cx="155" cy="106" r="4" fill="#2B3A33"/><line x1="155" y1="106" x2="420" y2="106" stroke="#2B3A33" stroke-width="1" stroke-dasharray="3,3"/><text x="430" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="start" fill="#2B3A33" font-weight="bold">2. amorsa / șprițul</text><text x="430" y="121" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" text-anchor="start" fill="#555" font-style="italic">primer / scratch coat</text><rect x="160" y="40" width="40" height="220" fill="#E0E0E0" stroke="#2B3A33" stroke-width="1.5"/><circle cx="180" cy="150" r="4" fill="#2B3A33"/><line x1="180" y1="150" x2="420" y2="150" stroke="#2B3A33" stroke-width="1" stroke-dasharray="3,3"/><text x="430" y="148" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="start" fill="#2B3A33" font-weight="bold">3. tencuiala (grundul)</text><text x="430" y="165" font-family="Ar