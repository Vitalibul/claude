<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect x="40" y="90" width="300" height="30" fill="#EF9A9A" stroke="#D9412B" stroke-width="2"/><rect x="340" y="90" width="420" height="30" fill="#FFE082" stroke="#F9A825" stroke-width="2"/><path d="M760,90 h80 l20,15 l-20,15 h-80z" fill="#C8E6C9" stroke="#2E7D55" stroke-width="2"/><line x1="40" y1="74" x2="40" y2="136" stroke="#2B3A33" stroke-width="3"/><text x="40" y="66" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle" fill="#2B3A33" font-weight="bold">ziua 1</text><line x1="340" y1="74" x2="340" y2="136" stroke="#2B3A33" stroke-width="3"/><text x="340" y="66" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle" fill="#2B3A33" font-weight="bold">6 luni</text><line x1="760" y1="74" x2="760" y2="136" stroke="#2B3A33" stroke-width="3"/><text x="760" y="66" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle" fill="#2B3A33" font-weight="bold">2 ani</text><text x="40" y="42" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12.5" text-anchor="start" fill="#555" font-style="italic">începi munca · data din REGES-ONLINE</text><text x="190" y="156" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#D9412B" font-weight="bold">NU poți cere tu</text><text x="190" y="174" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#D9412B" font-weight="bold">schimbarea angajatorului</text><text x="190" y="192" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#2B3A33" font-style="italic">excepție: încălcări grave ale</text><text x="190" y="207" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#2B3A33" font-style="italic">contractului de către angajator</text><text x="550" y="156" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#8D6E00" font-weight="bold">poți schimba angajatorul</text><text x="550" y="174" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#8D6E00" font-weight="bold">NUMAI prin agenția de plasare</text><text x="550" y="192" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#2B3A33" font-style="italic">care a semnat contractul de plasare</text><text x="820" y="156" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#2E7D55" font-weight="bold">după 2 ani:</text><text x="820" y="174" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#2E7D55" font-weight="bold">întrebi la IGI</text><rect x="40" y="226" width="820" height="44" rx="10" fill="#E3EEF8" stroke="#2F6DA3" stroke-width="2"/><text x="450" y="254" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14.5" text-anchor="middle" fill="#2F6DA3" font-weight="bold">Contractul încetează?  Poți rămâne cel mult 90 de zile ca să găsești un nou angajator (IGI).</text></svg>