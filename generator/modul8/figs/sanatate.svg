<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330"><text x="10" y="24" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="start" fill="#1F5C45" font-weight="bold">A. Asigurarea și medicul de familie / Insurance and the family doctor</text><rect x="10" y="40" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="90" y="73" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">contract de muncă</text><text x="90" y="93" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">employment contract</text><path d="M172,77 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="196" y="40" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="276" y="73" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">CASS 10% reținut</text><text x="276" y="93" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">10% withheld from salary</text><path d="M358,77 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="382" y="40" width="160" height="74" rx="10" fill="#E3F1E8" stroke="#2E7D55" stroke-width="2.5"/><text x="462" y="73" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">ești asigurat</text><text x="462" y="93" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">you are insured</text><path d="M544,77 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="568" y="40" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="648" y="73" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">medicul de familie</text><text x="648" y="93" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">cerere + act de identitate</text><path d="M730,77 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="754" y="40" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="834" y="73" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">cardul de sănătate</text><text x="834" y="93" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">health card</text><text x="10" y="170" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="start" fill="#1F5C45" font-weight="bold">B. Concediul medical / Sick leave</text><rect x="10" y="186" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="90" y="219" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">ești bolnav</text><text x="90" y="239" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">you are ill</text><path d="M172,223 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="196" y="186" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="276" y="219" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">anunți angajatorul</text><text x="276" y="239" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">tell your employer</text><path d="M358,223 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="382" y="186" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="462" y="219" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">medicul îți dă</text><text x="462" y="239" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">certificat de concediu medical</text><path d="M544,223 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="568" y="186" width="160" height="74" rx="10" fill="#FFF4D6" stroke="#2E7D55" stroke-width="2.5"/><text x="648" y="219" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">îl dai la angajator</text><text x="648" y="239" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">până pe 5 a lunii următoare</text><path d="M730,223 h18 m-8,-7 l8,7 l-8,7" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="754" y="186" width="160" height="74" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2.5"/><text x="834" y="219" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle" fill="#2B3A33" font-weight="bold">indemnizația</text><text x="834" y="239" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">sick pay (conditions apply)</text><text x="470" y="300" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Indemnizația: cel puțin 6 luni de contribuții în ultimele 12 luni (OUG 158/2005). Suma și regulile de calcul — întrebați angajatorul.</text></svg>