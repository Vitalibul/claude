<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150"><text x="6" y="22" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" text-anchor="start" fill="#1F5C45" font-weight="bold">Ai pierdut pașaportul sau permisul? / Lost your passport or permit?</text><rect x="6" y="36" width="201" height="96" rx="10" fill="#E3F1E8" stroke="#2E7D55" stroke-width="2"/><circle cx="24" cy="54" r="13" fill="#2E7D55"/><text x="24" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="106.5" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">Poliția</text><text x="106.5" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">declari pierderea / furtul</text><text x="106.5" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">primești o dovadă</text><path d="M211,84 h14 m-6,-6 l6,6 l-6,6" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="231" y="36" width="201" height="96" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2"/><circle cx="249" cy="54" r="13" fill="#2E7D55"/><text x="249" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="331.5" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">Ambasada</text><text x="331.5" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">a țării tale</text><text x="331.5" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">pașaport nou</text><path d="M436,84 h14 m-6,-6 l6,6 l-6,6" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="456" y="36" width="201" height="96" rx="10" fill="#E3F1E8" stroke="#2E7D55" stroke-width="2"/><circle cx="474" cy="54" r="13" fill="#2E7D55"/><text x="474" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="556.5" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">IGI</text><text x="556.5" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">ceri un permis nou</text><text x="556.5" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">cu dovada de la poliție</text><path d="M661,84 h14 m-6,-6 l6,6 l-6,6" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="681" y="36" width="201" height="96" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2"/><circle cx="699" cy="54" r="13" fill="#2E7D55"/><text x="699" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="781.5" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">Banca, angajatorul</text><text x="781.5" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">anunți schimbarea</text><text x="781.5" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">documentul nou</text></svg>