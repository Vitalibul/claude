<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150"><text x="6" y="22" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="16" text-anchor="start" fill="#1F5C45" font-weight="bold">Curățenia unei camere de hotel / Cleaning a hotel room</text><rect x="6" y="36" width="126" height="96" rx="10" fill="#E3F1E8" stroke="#2E7D55" stroke-width="2"/><circle cx="24" cy="54" r="13" fill="#2E7D55"/><text x="24" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="69" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">aerisirea</text><text x="69" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">air the room</text><text x="69" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">deschide fereastra</text><path d="M136,84 h14 m-6,-6 l6,6 l-6,6" fill="none" stroke="#2E7D55" stroke-width="3"/><rect x="156" y="36" width="126" height="96" rx="10" fill="#fff" stroke="#2E7D55" stroke-width="2"/><circle cx="174" cy="54" r="13" fill="#2E7D55"/><text x="174" y="59" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="219" y="86" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#2B3A33" font-weight="bold">patul</text><text x="219" y="104" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-anchor="middle" fill="#555" font-style="italic">strip &amp; make the bed</text><text x="219" y="120" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="12" text-an