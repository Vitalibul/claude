<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236"><rect x="20" y="20" width="400" height="200" rx="12" fill="#fff" stroke="#C62828" stroke-width="4"/><rect x="20" y="20" width="400" height="50" rx="12" fill="#C62828"/><text x="220" y="52" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">A se consuma înainte de:</text><text x="220" y="100" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#555" font-style="italic">use by — fresh meat, milk, fish...</text><text x="220" y="140" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="26" text-anchor="middle" fill="#2B3A33" font-weight="bold">12.10.2026</text><text x="220" y="178" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#C62828" font-weight="bold">După această dată: NU se mai vinde.</text><text x="220" y="198" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" fill="#555" font-style="italic">After this date the food is not safe.</text><rect x="460" y="20" width="400" height="200" rx="12" fill="#fff" stroke="#1565C0" stroke-width="4"/><rect x="460" y="20" width="400" height="50" rx="12" fill="#1565C0"/><text x="660" y="52" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="17" text-anchor="middle" fill="#fff" font-weight="bold">A se consuma de preferință înainte de:</text><text x="660" y="100" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#555" font-style="italic">best before — pasta, rice, biscuits...</text><text x="660" y="140" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="26" text-anchor="middle" fill="#2B3A33" font-weight="bold">03.2027</text><text x="660" y="178" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="14" text-anchor="middle" fill="#1565C0" font-weight="bold">Calitatea e garantată până la această dată.</text><text x="660" y="198" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle" fill="#555" font-style="italic">Quality guaranteed until this date.</text></svg>